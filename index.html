<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070202">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sperrins Sky Forecast</title>
<style>
:root{
  --bg:#070202; --s1:#120505; --s2:#1b0808; --line:#2c0f0c;
  --tx:#e8897a; --tx2:#b05a4b; --tx3:#7d3d32;
  --acc:#ff4a36; --acc-dim:#9c2a1e;
  --r5:#ff5a40; --r4:#dd4632; --r3:#ad3a29; --r2:#7f2d1f; --r1:#552016;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%}
a{color:var(--acc)}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
header h1{font-size:22px;margin:4px 0 2px;color:var(--acc);letter-spacing:.2px}
header .sub{color:var(--tx2);font-size:13px}
.status{margin:10px 0 4px;font-size:13px;color:var(--tx2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.btn{background:var(--s2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:active{background:var(--line)}
.banner{border:1px solid var(--acc-dim);background:#1a0604;color:var(--tx);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.banner b{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.card{display:block;text-decoration:none;color:inherit;background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.card:active,.card:hover{border-color:var(--acc-dim)}
.card .top{display:flex;align-items:flex-start;gap:12px}
.score{min-width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;
  border:2px solid currentColor;font-weight:700;font-size:20px;line-height:1}
.score small{font-size:9px;font-weight:600;letter-spacing:.4px;margin-top:2px;opacity:.85}
.card h2{font-size:16px;margin:0;color:var(--tx)}
.card .rating{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}
.reason{margin:8px 0 6px;font-size:14px;color:var(--tx)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--tx2)}
.meta b{color:var(--tx);font-weight:600}
.subs{display:flex;gap:10px;margin-top:8px}
.sub-score{flex:1;font-size:11.5px;color:var(--tx2)}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--acc)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:10px}
.spark i{flex:1;background:var(--r2);border-radius:2px 2px 0 0;min-height:2px}
.spark i.win{background:var(--r5)}
.spark i.na{background:transparent;border-bottom:2px dotted var(--tx3)}
.c5{color:var(--r5)}.c4{color:var(--r4)}.c3{color:var(--r3)}.c2{color:var(--r2)}.c1{color:var(--r1)}
/* detail */
.back{display:inline-block;margin:6px 0 10px;text-decoration:none;font-size:14px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:14px;color:var(--acc);text-transform:uppercase;letter-spacing:.7px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 12px;font-size:13.5px}
.kv div span{display:block;font-size:11.5px;color:var(--tx2)}
.tl-head,.tl-row{display:grid;grid-template-columns:40px 60px 1fr 40px 34px;gap:7px;align-items:center;font-size:13px}
.tl-head{color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tl-row{padding:5px 0;border-bottom:1px solid var(--line)}
.tl-row.win{background:linear-gradient(90deg,rgba(255,74,54,.10),transparent)}
.tl-row.past{opacity:.45}
.dark-chip{font-size:11px;border-radius:5px;padding:2px 5px;text-align:center;white-space:nowrap}
.d0{background:#2a1410;color:var(--tx2)}.d1{background:#1f0c0a;color:var(--tx2)}.d2{background:#120404;color:var(--tx)}.d3{background:#000;color:var(--acc);border:1px solid var(--line)}
.cloud{display:flex;align-items:center;gap:6px}
.cloud .track{flex:1;height:10px;background:var(--s2);border-radius:4px;overflow:hidden}
.cloud .track i{display:block;height:100%;background:#5a2c24}
.cloud em{font-style:normal;font-size:12px;min-width:32px;text-align:right;color:var(--tx)}
.layers{font-size:10.5px;color:var(--tx3);margin-top:2px}
.q{font-weight:700;text-align:right}
.small{font-size:12.5px;color:var(--tx2)}
table.plain{width:100%;border-collapse:collapse;font-size:13.5px}
table.plain td,table.plain th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.plain th{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
details{margin-top:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
details summary{cursor:pointer;color:var(--acc);font-weight:600}
details p,details li{font-size:13.5px}
code{background:var(--s2);padding:1px 4px;border-radius:4px;font-size:12.5px}
footer{margin-top:16px;font-size:12px;color:var(--tx3)}
.src-ok{color:var(--tx)}.src-bad{color:var(--acc)}
.center{text-align:center;padding:40px 10px}
@media (min-width:720px){ .wrap{padding:22px 20px 48px} header h1{font-size:26px} .detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px} .detail-cols .panel{margin-bottom:0} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sperrins Sky Forecast</h1>
    <div class="sub" id="loc-line">OM Dark Sky Park, Davagh Forest, County Tyrone</div>
  </header>
  <div class="status" id="status"></div>
  <div id="banners"></div>
  <main id="view"><div class="center small">Loading forecast…</div></main>
  <details id="how"></details>
  <footer id="footer"></footer>
</div>

<script id="core">
/* Sperrins Sky Forecast: forecast and scoring core. No DOM access here, so it can be unit-tested in Node. */
(function (root) {
'use strict';

/* ============================ CONFIGURATION ============================
   All scoring weights and thresholds live here. Edit, save and reload.
   Each "weight" is between 0 and 1: how far that factor, at its worst,
   can pull an hour's rating down (1 = it can make the hour worthless). */
const CONFIG = {
  location: { name: 'OM Dark Sky Park, Davagh Forest', lat: 54.7203, lon: -6.9233, timeZone: 'Europe/London' },
  nights: 7,
  stargazing: {
    cloudWeight: 1.0,        // 100% cloud makes an hour worthless
    moonWeight: 0.75,        // a full Moon high in the sky removes 75% of an hour's value
    visibilityWeight: 0.5,   // thick fog/haze removes 50% of an hour's value
    emphasis: 2,             // hour qualities are raised to this power before adding up, so a few
                             // excellent hours outweigh many poor ones (1 = plain sum)
    targetHours: 4,          // this many perfect dark hours earns a score of 100
    windowThreshold: 0.5,    // hours rated at least this form the "best viewing window"
  },
  darkness: {                // how dark the sky is, from the Sun's altitude (degrees)
    civil: -6,               // above this: too bright (weight 0)
    nautical: -12,           // at this altitude the sky counts as 25% dark (nauticalWeight)
    astro: -18,              // below this: fully dark (weight 1)
    nauticalWeight: 0.25,
  },
  moon: {
    fullEffectAltitude: 30,  // Moon at or above this altitude (deg) has its full effect
    lowMoonShare: 0.4,       // a Moon just above the horizon has 40% of its full effect
  },
  visibility: { poorMetres: 1000, goodMetres: 10000 },
  aurora: {
    // Kp index -> base chance of a visible aurora from Davagh (about 57-58 deg geomagnetic latitude).
    // Linear between points. Kp 5 is the usual threshold for the northern horizon in Northern Ireland.
    kpChance: [[3, 0], [4, 0.15], [5, 0.45], [6, 0.75], [7, 0.95], [8, 1]],
    cloudWeight: 1.0,        // cloud blocks aurora as fully as stars
    moonWeight: 0.4,         // a bright Moon washes out faint aurora, but less than stars
    outlookWeight: 0.7,      // nights beyond the 3-day Kp forecast use the 27-day outlook, trusted less
    darkFrom: -6,            // Sun altitude where aurora watching can begin...
    darkFull: -12,           // ...and where it is fully dark enough
  },
  iss: { minElevation: 10, stepSeconds: 20, maxSunAltitude: -6, staleTleDays: 10 },
  ratings: [[80, 'Excellent'], [60, 'Good'], [40, 'Fair'], [20, 'Poor'], [0, 'Not worthwhile']],
  staleHours: 9,             // warn if a source has not refreshed for this long
};
/* ====================================================================== */

const HOUR = 3600e3, MIN = 60e3, DAY = 86400e3;
const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const isNum = (x) => typeof x === 'number' && Number.isFinite(x);
const S = () => root.SunCalc;

/* ---------- factor functions (each returns 0..1) ---------- */
function darknessWeight(sunAlt, c = CONFIG.darkness) {
  if (!isNum(sunAlt) || sunAlt >= c.civil) return 0;
  if (sunAlt >= c.nautical) return c.nauticalWeight * (c.civil - sunAlt) / (c.civil - c.nautical);
  if (sunAlt > c.astro) return c.nauticalWeight + (1 - c.nauticalWeight) * (c.nautical - sunAlt) / (c.nautical - c.astro);
  return 1;
}
function moonInterference(moonAlt, illum, c = CONFIG.moon) {
  if (!isNum(moonAlt) || !isNum(illum) || moonAlt <= 0) return 0;
  const f = clamp(moonAlt / c.fullEffectAltitude, 0, 1);
  return clamp(illum, 0, 1) * (c.lowMoonShare + (1 - c.lowMoonShare) * f);
}
function visibilityFactor(vis, c = CONFIG.visibility) {
  if (!isNum(vis)) return 1;
  return clamp((vis - c.poorMetres) / (c.goodMetres - c.poorMetres), 0, 1);
}
function hourQuality(h, w = CONFIG.stargazing) {
  if (!isNum(h.cloud)) return null;
  return h.darkness
    * (1 - w.cloudWeight * clamp(h.cloud, 0, 100) / 100)
    * (1 - w.moonWeight * h.moonInt)
    * (1 - w.visibilityWeight * (1 - h.visF));
}
function kpChance(kp, table = CONFIG.aurora.kpChance) {
  if (!isNum(kp)) return 0;
  if (kp <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) {
    const [k1, c1] = table[i - 1], [k2, c2] = table[i];
    if (kp <= k2) return c1 + (c2 - c1) * (kp - k1) / (k2 - k1);
  }
  return table[table.length - 1][1];
}
function auroraDarkness(sunAlt, a = CONFIG.aurora) {
  if (!isNum(sunAlt) || sunAlt >= a.darkFrom) return 0;
  return clamp((a.darkFrom - sunAlt) / (a.darkFrom - a.darkFull), 0, 1);
}
function auroraHourChance(h, a = CONFIG.aurora) {
  if (!isNum(h.cloud) || !isNum(h.kp)) return isNum(h.cloud) ? 0 : null;
  return kpChance(h.kp, a.kpChance) * (h.kpSource === 'outlook' ? a.outlookWeight : 1)
    * (1 - a.cloudWeight * clamp(h.cloud, 0, 100) / 100)
    * (1 - a.moonWeight * h.moonInt)
    * auroraDarkness(h.sunAlt, a);
}

/* ---------- best window: highest-scoring run of consecutive hours above the threshold ---------- */
function bestWindow(slots, thr = CONFIG.stargazing.windowThreshold) {
  let best = null, sum = 0, start = 0;
  for (let i = 0; i < slots.length; i++) {
    const q = slots[i].quality;
    const v = isNum(q) ? q - thr : -Infinity;
    if (sum <= 0) { sum = v; start = i; } else sum += v;
    if (!isNum(sum)) { sum = 0; continue; }
    if (sum > 0 && (!best || sum > best.sum)) best = { sum, i0: start, i1: i };
  }
  if (!best) return null;
  const run = slots.slice(best.i0, best.i1 + 1);
  return {
    start: run[0].t, end: run[run.length - 1].t + HOUR, hours: run.length,
    meanQuality: run.reduce((s, x) => s + x.quality, 0) / run.length,
  };
}

/* ---------- night scoring from evaluated hourly slots (pure; used by tests) ---------- */
function scoreSlots(slots, cfg = CONFIG) {
  const live = slots.filter((s) => !s.past);
  const withData = live.filter((s) => isNum(s.cloud));
  const coverage = live.length ? withData.length / live.length : 0;
  for (const s of slots) {
    s.quality = hourQuality(s, cfg.stargazing);
    s.auroraChance = auroraHourChance(s, cfg.aurora);
  }
  if (!live.length || coverage < 0.5) {
    return { star: null, aurora: null, overall: null, qualityHours: null, window: null, coverage };
  }
  const qualityHours = withData.reduce((sum, s) => sum + Math.pow(s.quality, cfg.stargazing.emphasis), 0);
  const star = Math.round(100 * clamp(qualityHours / cfg.stargazing.targetHours, 0, 1));
  const aurora = Math.round(100 * withData.reduce((m, s) => Math.max(m, s.auroraChance || 0), 0));
  return {
    star, aurora, overall: Math.max(star, aurora), qualityHours,
    window: bestWindow(live, cfg.stargazing.windowThreshold), coverage,
  };
}

function ratingFor(score, cfg = CONFIG) {
  if (!isNum(score)) return 'No data';
  for (const [min, label] of cfg.ratings) if (score >= min) return label;
  return cfg.ratings[cfg.ratings.length - 1][1];
}

/* ---------- astronomy helpers ---------- */
function sunAltAt(t, loc) { return S().getPosition(new Date(t), loc.lat, loc.lon).altitude; }
function moonAltAt(t, loc) { return S().getMoonPosition(new Date(t), loc.lat, loc.lon).altitude; }
function moonIllumAt(t) { return S().getMoonIllumination(new Date(t)); }

// Times where fn crosses `level` between t0 and t1 (linear interpolation between samples).
function crossings(fn, t0, t1, step, level) {
  const out = [];
  let tp = t0, vp = fn(t0) - level;
  for (let t = t0 + step; t <= t1; t += step) {
    const v = fn(t) - level;
    if ((vp < 0) !== (v < 0)) {
      out.push({ t: Math.round(tp + (t - tp) * (vp / (vp - v))), dir: v < 0 ? 'down' : 'up' });
    }
    tp = t; vp = v;
  }
  return out;
}

function localDateStr(t, tz = CONFIG.location.timeZone) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(t));
}
function addDays(dateStr, k) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + k)).toISOString().slice(0, 10);
}

/** Sunset, sunrise and astronomical twilight for the night starting on local date dateStr. */
function nightFrame(dateStr, loc = CONFIG.location) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const t0 = Date.UTC(y, m - 1, d, 12), t1 = t0 + DAY;
  const f = (t) => sunAltAt(t, loc);
  const step = 5 * MIN;
  const set = crossings(f, t0, t1, step, -0.833);
  const sunset = (set.find((c) => c.dir === 'down') || {}).t;
  const sunrise = (set.find((c) => c.dir === 'up' && c.t > sunset) || {}).t;
  const astro = crossings(f, t0, t1, step, -18);
  const astroDusk = (astro.find((c) => c.dir === 'down') || {}).t ?? null;
  const astroDawn = astroDusk != null ? ((astro.find((c) => c.dir === 'up' && c.t > astroDusk) || {}).t ?? null) : null;
  const darkHours = astroDusk != null && astroDawn != null ? (astroDawn - astroDusk) / HOUR : 0;
  return { date: dateStr, sunset, sunrise, astroDusk, astroDawn, darkHours };
}

function phaseName(p) {
  if (p < 0.03 || p > 0.97) return 'New';
  if (p < 0.22) return 'Waxing crescent';
  if (p < 0.28) return 'First quarter';
  if (p < 0.47) return 'Waxing gibbous';
  if (p < 0.53) return 'Full';
  if (p < 0.72) return 'Waning gibbous';
  if (p < 0.78) return 'Last quarter';
  return 'Waning crescent';
}

function moonSummary(frame, loc = CONFIG.location) {
  const mid = (frame.sunset + frame.sunrise) / 2;
  const ill = moonIllumAt(mid);
  const f = (t) => moonAltAt(t, loc);
  const ev = crossings(f, frame.sunset, frame.sunrise, 5 * MIN, 0);
  let upDarkHours = 0, maxDarkAlt = -90;
  if (frame.astroDusk != null) {
    const st = 5 * MIN;
    for (let t = frame.astroDusk; t < frame.astroDawn; t += st) {
      const a = f(t);
      if (a > 0) upDarkHours += st / HOUR;
      maxDarkAlt = Math.max(maxDarkAlt, a);
    }
  }
  return {
    illumination: ill.fraction, phase: ill.phase, phaseName: phaseName(ill.phase),
    upAtSunset: f(frame.sunset) > 0, upAtSunrise: f(frame.sunrise) > 0,
    rise: (ev.find((e) => e.dir === 'up') || {}).t ?? null,
    set: (ev.find((e) => e.dir === 'down') || {}).t ?? null,
    upDarkHours, moonlessDarkHours: Math.max(0, frame.darkHours - upDarkHours),
    maxDarkAlt: frame.astroDusk != null ? maxDarkAlt : null,
  };
}

/* ---------- data lookups ---------- */
function weatherIndex(w) {
  const map = new Map();
  if (w && Array.isArray(w.time)) w.time.forEach((t, i) => map.set(t, i));
  return map;
}
function avg2(a, b) {
  if (isNum(a) && isNum(b)) return (a + b) / 2;
  return isNum(a) ? a : isNum(b) ? b : null;
}
function kpAt(t, kpList, outlook) {
  if (Array.isArray(kpList)) {
    for (const b of kpList) {
      const s = Date.parse(b.t);
      if (t >= s && t < s + 3 * HOUR) return { kp: b.kp, source: 'forecast', kind: b.kind };
    }
  }
  if (outlook && Array.isArray(outlook.days)) {
    const day = new Date(t).toISOString().slice(0, 10);
    const d = outlook.days.find((x) => x.date === day);
    if (d) return { kp: d.kp, source: 'outlook', kind: 'outlook' };
  }
  return { kp: null, source: null, kind: null };
}

/** Hourly slots [t, t+1h) whose midpoint lies between sunset and sunrise. */
function buildSlots(frame, data, now, loc = CONFIG.location) {
  const w = data?.sources?.weather?.data;
  const idx = weatherIndex(w);
  const kpList = data?.sources?.kp?.data;
  const outlook = data?.sources?.kpOutlook?.data;
  const slots = [];
  const first = Math.floor(frame.sunset / HOUR) * HOUR;
  for (let t = first; t < frame.sunrise; t += HOUR) {
    const mid = t + HOUR / 2;
    if (mid <= frame.sunset || mid >= frame.sunrise) continue;
    const i0 = idx.get(t), i1 = idx.get(t + HOUR);
    const pick = (arr) => (arr ? avg2(i0 != null ? arr[i0] : null, i1 != null ? arr[i1] : null) : null);
    const sunAlt = sunAltAt(mid, loc);
    const moonAlt = moonAltAt(mid, loc);
    const illum = moonIllumAt(mid).fraction;
    const vis = pick(w?.visibility);
    const k = kpAt(mid, kpList, outlook);
    slots.push({
      t, past: now != null && t + HOUR <= now,
      cloud: pick(w?.cloud), cloudLow: pick(w?.cloudLow), cloudMid: pick(w?.cloudMid), cloudHigh: pick(w?.cloudHigh),
      visibility: vis, visF: visibilityFactor(vis), sunAlt, moonAlt, illum,
      darkness: darknessWeight(sunAlt), moonInt: moonInterference(moonAlt, illum),
      kp: k.kp, kpSource: k.source, kpKind: k.kind,
    });
  }
  return slots;
}

/* ---------- ISS visible passes ---------- */
function sunVectorEci(date) {
  // Low-precision solar position (Astronomical Almanac), unit vector in the equatorial frame of date.
  const n = date.getTime() / DAY + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474 * n) * DEG, g = (357.528 + 0.9856003 * n) * DEG;
  const lam = L + (1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * DEG;
  const eps = (23.439 - 0.0000004 * n) * DEG;
  return { x: Math.cos(lam), y: Math.cos(eps) * Math.sin(lam), z: Math.sin(eps) * Math.sin(lam) };
}
function isSunlit(r, date) {
  const s = sunVectorEci(date);
  const p = r.x * s.x + r.y * s.y + r.z * s.z;
  if (p > 0) return true;
  const px = r.x - p * s.x, py = r.y - p * s.y, pz = r.z - p * s.z;
  return Math.sqrt(px * px + py * py + pz * pz) > 6378.137; // outside Earth's (cylindrical) shadow
}
function compass(az) {
  return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(((az % 360) + 360) % 360 / 45) % 8];
}
function issPasses(tle, t0, t1, loc = CONFIG.location, c = CONFIG.iss) {
  const sat = root.satellite;
  if (!sat || !tle || !tle.line1) return [];
  const satrec = sat.twoline2satrec(tle.line1, tle.line2);
  const gd = { longitude: loc.lon * DEG, latitude: loc.lat * DEG, height: 0.25 };
  const passes = [];
  let cur = null;
  const close = () => { if (cur) { passes.push(cur); cur = null; } };
  for (let t = t0; t <= t1; t += c.stepSeconds * 1000) {
    const d = new Date(t);
    const pv = sat.propagate(satrec, d);
    if (!pv || !pv.position || typeof pv.position !== 'object') { close(); continue; }
    const look = sat.ecfToLookAngles(gd, sat.eciToEcf(pv.position, sat.gstime(d)));
    const el = look.elevation / DEG, az = look.azimuth / DEG;
    if (el < c.minElevation) { close(); continue; }
    const visible = isSunlit(pv.position, d) && sunAltAt(t, loc) <= c.maxSunAltitude;
    if (!cur) cur = { start: t, startAz: az, end: t, endAz: az, maxEl: el, maxT: t, visStart: null, visEnd: null, visMaxEl: null };
    cur.end = t; cur.endAz = az;
    if (el > cur.maxEl) { cur.maxEl = el; cur.maxT = t; }
    if (visible) {
      if (cur.visStart == null) { cur.visStart = t; cur.visStartAz = az; }
      cur.visEnd = t; cur.visEndAz = az;
      cur.visMaxEl = Math.max(cur.visMaxEl ?? 0, el);
    }
  }
  close();
  return passes.filter((p) => p.visStart != null).map((p) => ({
    start: p.visStart, end: p.visEnd, maxEl: Math.round(p.visMaxEl),
    from: compass(p.visStartAz), to: compass(p.visEndAz),
    durationMin: Math.max(1, Math.round((p.visEnd - p.visStart) / MIN)),
    fadesIntoShadow: p.visEnd < p.end,
  }));
}

/* ---------- one-line reason ---------- */
function fmtTime(t, tz = CONFIG.location.timeZone) {
  return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' }).format(new Date(t));
}
function nightReason(n, cfg = CONFIG) {
  const sc = n.scores;
  if (sc.star == null) return n.slots.every((s) => s.past) ? 'This night has ended.' : 'Cloud forecast not yet available for this night.';
  const live = n.slots.filter((s) => !s.past && isNum(s.cloud) && s.darkness > 0);
  const wsum = live.reduce((a, s) => a + s.darkness, 0) || 1;
  const mean = (f) => live.reduce((a, s) => a + s.darkness * f(s), 0) / wsum;
  const meanCloud = Math.round(mean((s) => s.cloud));
  const loss = {
    cloud: mean((s) => cfg.stargazing.cloudWeight * s.cloud / 100),
    moon: mean((s) => cfg.stargazing.moonWeight * s.moonInt),
    vis: mean((s) => cfg.stargazing.visibilityWeight * (1 - s.visF)),
    dark: n.frame.darkHours >= cfg.stargazing.targetHours ? 0 : 1 - n.frame.darkHours / cfg.stargazing.targetHours,
  };
  const win = sc.window ? `${fmtTime(sc.window.start)}–${fmtTime(sc.window.end)}` : null;
  const mo = n.moon, illum = Math.round(mo.illumination * 100);
  const moonNote = mo.upDarkHours < 0.25 ? 'Moon out of the way'
    : mo.set && mo.upAtSunset ? `${illum}% Moon sets ${fmtTime(mo.set)}`
    : mo.rise && !mo.upAtSunset ? `${illum}% Moon rises ${fmtTime(mo.rise)}`
    : `${illum}% Moon up`;
  const parts = [];
  if (sc.star >= 60) {
    parts.push(win ? `Clear spell ${win}` : 'Good conditions');
    parts.push(moonNote);
  } else {
    const main = Object.entries(loss).sort((a, b) => b[1] - a[1])[0][0];
    if (main === 'cloud') parts.push(meanCloud >= 85 ? `Overcast (${meanCloud}% cloud)` : win ? `Cloud breaks ${win}` : `Mostly cloudy (${meanCloud}% cloud)`);
    else if (main === 'moon') parts.push(`Bright ${mo.phaseName.toLowerCase()} Moon (${illum}% lit)` + (win ? `; best ${win}` : ''));
    else if (main === 'dark') parts.push(n.frame.darkHours === 0 ? 'No full darkness (summer twilight)' : `Only ${n.frame.darkHours.toFixed(1)} h of full darkness`);
    else parts.push('Fog or haze likely');
    if (main !== 'cloud' && meanCloud >= 50) parts.push(`${meanCloud}% cloud`);
  }
  if (sc.aurora >= 30) parts.push(`aurora chance ${sc.aurora} (Kp ${n.kpMax})`);
  return parts.join(' · ');
}

/* ---------- full forecast ---------- */
function buildNight(dateStr, data, now, cfg = CONFIG) {
  const loc = cfg.location;
  const frame = nightFrame(dateStr, loc);
  const slots = buildSlots(frame, data, now, loc);
  const scores = scoreSlots(slots, cfg);
  const moon = moonSummary(frame, loc);
  const kpVals = slots.filter((s) => !s.past && isNum(s.kp) && s.darkness > 0);
  const kpMax = kpVals.length ? Math.max(...kpVals.map((s) => s.kp)) : null;
  const kpSource = kpVals.some((s) => s.kpSource === 'forecast') ? 'forecast' : kpVals.length ? 'outlook' : null;
  const tle = data?.sources?.iss?.data;
  const iss = issPasses(tle, Math.max(frame.sunset, now ?? frame.sunset), frame.sunrise, loc, cfg.iss);
  const n = { date: dateStr, frame, slots, scores, moon, kpMax, kpSource, iss, rating: ratingFor(scores.overall, cfg) };
  n.reason = nightReason(n, cfg);
  return n;
}

function buildForecast(data, now = Date.now(), cfg = CONFIG) {
  const today = localDateStr(now, cfg.location.timeZone);
  const yesterday = addDays(today, -1);
  const yFrame = nightFrame(yesterday, cfg.location);
  const start = now < yFrame.sunrise ? yesterday : today;
  const nights = [];
  for (let k = 0; k < cfg.nights; k++) nights.push(buildNight(addDays(start, k), data, now, cfg));
  return { nights, generatedAt: data?.generatedAt ?? null };
}

root.SkyCore = {
  CONFIG, darknessWeight, moonInterference, visibilityFactor, hourQuality, kpChance, auroraDarkness,
  auroraHourChance, bestWindow, scoreSlots, ratingFor, nightFrame, moonSummary, buildSlots, kpAt,
  issPasses, isSunlit, compass, phaseName, nightReason, buildNight, buildForecast, localDateStr, addDays, fmtTime,
};
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script id="app">
(function () {
'use strict';
const C = window.SkyCore, CFG = C.CONFIG;
const CACHE_KEY = 'sperrins-sky-cache-v1';
const DATA_URL = 'data/latest.json';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tz = CFG.location.timeZone;
const fmtT = (t) => (t == null ? '—' : C.fmtTime(t, tz));
const fmtDay = (dateStr) => new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(dateStr + 'T12:00:00Z'));
const fmtWhen = (t) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(t));
const ago = (t) => { const h = (Date.now() - t) / 3600e3; return h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago` : `${h.toFixed(h < 10 ? 1 : 0)} h ago`; };
const cls = (s) => (s == null ? 'c1' : s >= 80 ? 'c5' : s >= 60 ? 'c4' : s >= 40 ? 'c3' : s >= 20 ? 'c2' : 'c1');

let state = { data: null, fromCache: false, error: null, forecast: null, savedAt: null };

function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } }
function writeCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data })); } catch { /* storage unavailable */ } }

async function load() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data || data.schema !== 1 || !data.sources) throw new Error('unexpected data format');
    state = { data, fromCache: false, error: null, savedAt: null };
    writeCache(data);
  } catch (e) {
    const cached = readCache();
    state = { data: cached?.data ?? null, fromCache: !!cached, error: e.message || String(e), savedAt: cached?.savedAt ?? null };
  }
  compute();
  render();
}

function compute() {
  state.forecast = null;
  if (!state.data) return;
  try { state.forecast = C.buildForecast(state.data, Date.now()); }
  catch (e) { state.error = 'Could not calculate the forecast: ' + e.message; }
}

function renderStatus() {
  const d = state.data;
  $('loc-line').textContent = `${CFG.location.name}, County Tyrone · ${CFG.location.lat.toFixed(3)}°N ${Math.abs(CFG.location.lon).toFixed(3)}°W`;
  const bits = [];
  if (d?.generatedAt) bits.push(`Data fetched ${fmtWhen(Date.parse(d.generatedAt))} (${ago(Date.parse(d.generatedAt))})`);
  bits.push('<button class="btn" id="refresh">Refresh</button>');
  $('status').innerHTML = bits.join(' ');
  $('refresh').onclick = () => { $('status').insertAdjacentHTML('beforeend', ' <span>Refreshing…</span>'); load(); };

  const b = [];
  if (state.error && state.fromCache) b.push(`<div class="banner"><b>Offline or unavailable.</b> Could not load fresh data (${esc(state.error)}). Showing data saved on this device ${state.savedAt ? 'at ' + fmtWhen(state.savedAt) : ''}.</div>`);
  else if (state.error && !state.data) b.push(`<div class="banner"><b>No forecast data.</b> ${esc(state.error)}. Check your connection and press Refresh.</div>`);
  else if (state.error) b.push(`<div class="banner"><b>Problem:</b> ${esc(state.error)}</div>`);
  if (d?.sources) {
    const stale = [];
    for (const s of Object.values(d.sources)) {
      const last = s.lastSuccessAt ? Date.parse(s.lastSuccessAt) : null;
      if (!s.data) stale.push(`${esc(s.label)}: no data yet${s.error ? ' (' + esc(s.error) + ')' : ''}`);
      else if (!last || Date.now() - last > CFG.staleHours * 3600e3) stale.push(`${esc(s.label)}: last updated ${last ? ago(last) : 'unknown'}`);
      else if (!s.ok) stale.push(`${esc(s.label)}: latest fetch failed, using data from ${ago(last)}`);
    }
    if (stale.length) b.push(`<div class="banner"><b>Some data is out of date.</b><br>${stale.join('<br>')}</div>`);
  }
  $('banners').innerHTML = b.join('');
}

function spark(n) {
  const w = n.scores.window;
  return '<div class="spark" aria-hidden="true">' + n.slots.map((s) => {
    if (s.quality == null) return '<i class="na"></i>';
    const inWin = w && s.t >= w.start && s.t < w.end;
    return `<i class="${inWin ? 'win' : ''}" style="height:${Math.max(6, Math.round(s.quality * 100))}%;${s.past ? 'opacity:.35' : ''}"></i>`;
  }).join('') + '</div>';
}

function renderOverview() {
  const f = state.forecast;
  if (!f) { $('view').innerHTML = '<div class="center small">No forecast to show yet.</div>'; return; }
  $('view').innerHTML = '<div class="grid">' + f.nights.map((n, i) => {
    const sc = n.scores, w = sc.window;
    const label = i === 0 ? 'Tonight' : i === 1 ? 'Tomorrow' : fmtDay(n.date);
    return `<a class="card" href="#night-${n.date}">
      <div class="top">
        <div class="score ${cls(sc.overall)}">${sc.overall ?? '–'}<small>SCORE</small></div>
        <div style="flex:1;min-width:0">
          <h2>${label} <span class="small">${i < 2 ? fmtDay(n.date) : ''}</span></h2>
          <div class="rating">${n.rating}</div>
          <div class="reason">${esc(n.reason)}</div>
        </div>
      </div>
      <div class="meta">
        <span>Best window <b>${w ? `${fmtT(w.start)}–${fmtT(w.end)}` : 'none'}</b></span>
        <span>Dark <b>${n.frame.darkHours.toFixed(1)} h</b></span>
        <span>Moon <b>${Math.round(n.moon.illumination * 100)}%</b></span>
        ${n.iss.length ? `<span>ISS <b>${n.iss.length} pass${n.iss.length > 1 ? 'es' : ''}</b></span>` : ''}
      </div>
      <div class="subs">
        <div class="sub-score">Stargazing ${sc.star ?? '–'}<div class="bar"><i style="width:${sc.star ?? 0}%"></i></div></div>
        <div class="sub-score">Aurora ${sc.aurora ?? '–'}<div class="bar"><i style="width:${sc.aurora ?? 0}%"></i></div></div>
      </div>
      ${spark(n)}
    </a>`;
  }).join('') + '</div>';
}

function darkChip(s) {
  if (s.sunAlt <= CFG.darkness.astro) return '<span class="dark-chip d3">Dark</span>';
  if (s.sunAlt <= CFG.darkness.nautical) return '<span class="dark-chip d2">Astro tw.</span>';
  if (s.sunAlt <= CFG.darkness.civil) return '<span class="dark-chip d1">Nautical</span>';
  return '<span class="dark-chip d0">Twilight</span>';
}
const n0 = (x) => (x == null ? '–' : Math.round(x));

function renderDetail(dateStr) {
  const f = state.forecast;
  const n = f && f.nights.find((x) => x.date === dateStr);
  if (!n) { location.hash = ''; return; }
  const sc = n.scores, fr = n.frame, mo = n.moon, w = sc.window;
  const aw = state.data?.sources?.aurorawatch;
  const isFirst = f.nights[0] === n;
  const rows = n.slots.map((s) => {
    const inWin = w && s.t >= w.start && s.t < w.end;
    return `<div class="tl-row ${inWin ? 'win' : ''} ${s.past ? 'past' : ''}">
      <div>${fmtT(s.t)}</div>
      <div>${darkChip(s)}</div>
      <div>${s.cloud == null ? '<span class="small">no data</span>' : `<div class="cloud"><span class="track"><i style="width:${Math.round(s.cloud)}%"></i></span><em>${Math.round(s.cloud)}%</em></div>
        <div class="layers">L ${n0(s.cloudLow)} · M ${n0(s.cloudMid)} · H ${n0(s.cloudHigh)}${s.visibility != null ? ' · vis ' + (s.visibility / 1000).toFixed(s.visibility < 10000 ? 1 : 0) + ' km' : ''}</div>`}</div>
      <div class="small">${s.moonAlt > 0 ? Math.round(s.moonAlt) + '°' : 'down'}</div>
      <div class="q ${cls(s.quality == null ? null : s.quality * 100)}">${s.quality == null ? '–' : Math.round(s.quality * 100)}</div>
    </div>`;
  }).join('');
  const kpRows = [];
  const seen = new Set();
  for (const s of n.slots) {
    if (s.kp == null) continue;
    const key = s.kpSource === 'forecast' ? Math.floor((s.t + 1800e3) / (3 * 3600e3)) : 'o' + new Date(s.t).toISOString().slice(0, 10);
    if (seen.has(key)) continue; seen.add(key);
    kpRows.push(`<tr><td>${fmtT(s.t)}</td><td>${s.kp.toFixed(2).replace(/\.?0+$/, '')}</td><td>${s.kpSource === 'forecast' ? esc(s.kpKind) + ' (3-hour)' : '27-day outlook (daily max)'}</td></tr>`);
  }
  const tle = state.data?.sources?.iss?.data;
  const tleAge = tle?.epoch ? (Date.now() - Date.parse(tle.epoch)) / 86400e3 : null;
  $('view').innerHTML = `
    <a class="back" href="#">← All nights</a>
    <div class="panel">
      <div class="top" style="display:flex;gap:14px;align-items:center">
        <div class="score ${cls(sc.overall)}" style="min-width:68px;height:68px;font-size:24px">${sc.overall ?? '–'}<small>SCORE</small></div>
        <div><h2 style="margin:0;font-size:19px">Night of ${fmtDay(n.date)}</h2>
        <div class="rating small" style="text-transform:uppercase;letter-spacing:.6px">${n.rating}</div></div>
      </div>
      <div class="reason" style="font-size:15px">${esc(n.reason)}</div>
      <div class="subs">
        <div class="sub-score">Stargazing ${sc.star ?? '–'} / 100<div class="bar"><i style="width:${sc.star ?? 0}%"></i></div></div>
        <div class="sub-score">Aurora ${sc.aurora ?? '–'} / 100<div class="bar"><i style="width:${sc.aurora ?? 0}%"></i></div></div>
      </div>
      <p class="small" style="margin:8px 0 0">${sc.qualityHours != null ? `${sc.qualityHours.toFixed(1)} quality-hours of a ${CFG.stargazing.targetHours}-hour target. ` : ''}Best window: <b>${w ? `${fmtT(w.start)}–${fmtT(w.end)} (${w.hours} h, average rating ${Math.round(w.meanQuality * 100)})` : 'no hours reach the window threshold'}</b>.</p>
    </div>
    <div class="detail-cols">
      <div class="panel"><h3>Sun and darkness</h3><div class="kv">
        <div><span>Sunset</span>${fmtT(fr.sunset)}</div>
        <div><span>Astronomical dusk</span>${fr.astroDusk ? fmtT(fr.astroDusk) : 'none'}</div>
        <div><span>Astronomical dawn</span>${fr.astroDawn ? fmtT(fr.astroDawn) : 'none'}</div>
        <div><span>Sunrise</span>${fmtT(fr.sunrise)}</div>
        <div><span>Full darkness</span>${fr.darkHours.toFixed(1)} h</div>
        <div><span>Dark and moonless</span>${mo.moonlessDarkHours.toFixed(1)} h</div>
      </div></div>
      <div class="panel"><h3>Moon</h3><div class="kv">
        <div><span>Phase</span>${mo.phaseName}</div>
        <div><span>Illuminated</span>${Math.round(mo.illumination * 100)}%</div>
        <div><span>Moonrise (overnight)</span>${mo.rise ? fmtT(mo.rise) : mo.upAtSunset ? 'already up' : 'none'}</div>
        <div><span>Moonset (overnight)</span>${mo.set ? fmtT(mo.set) : mo.upAtSunrise ? 'still up at dawn' : 'none'}</div>
        <div><span>Up during darkness</span>${mo.upDarkHours.toFixed(1)} h</div>
        <div><span>Highest in darkness</span>${mo.maxDarkAlt != null && mo.maxDarkAlt > 0 ? Math.round(mo.maxDarkAlt) + '°' : 'below horizon'}</div>
      </div></div>
    </div>
    <div class="panel" style="margin-top:12px"><h3>Hour by hour</h3>
      <div class="tl-head"><div>Time</div><div>Sky</div><div>Cloud (L·M·H layers)</div><div>Moon</div><div style="text-align:right">Rating</div></div>
      ${rows || '<p class="small">No hours in this night.</p>'}
      <p class="small">Rating = hour quality ×100 (darkness × clear sky × Moon × visibility). Highlighted rows form the best window.</p>
    </div>
    <div class="detail-cols">
      <div class="panel"><h3>ISS passes</h3>
        ${!tle ? '<p class="small">No ISS orbital data available.</p>' : n.iss.length ? `<table class="plain"><tr><th>Time</th><th>Max</th><th>Path</th></tr>${n.iss.map((p) => `<tr><td>${fmtT(p.start)}–${fmtT(p.end)}<div class="small">${p.durationMin} min${p.fadesIntoShadow ? ', fades into shadow' : ''}</div></td><td>${p.maxEl}°</td><td>${p.from} → ${p.to}</td></tr>`).join('')}</table>` : '<p class="small">No visible passes this night (above 10°, sunlit, sky dark).</p>'}
        ${tle ? `<p class="small">Orbit from CelesTrak, epoch ${fmtWhen(Date.parse(tle.epoch))}${tleAge > CFG.iss.staleTleDays ? ' (old: predictions may be wrong)' : ''}. Passes several days ahead may shift by a few minutes.</p>` : ''}
      </div>
      <div class="panel"><h3>Aurora</h3>
        <p style="margin:0 0 6px">Aurora score <b>${sc.aurora ?? '–'}</b>${n.kpMax != null ? ` · highest Kp in darkness <b>${n.kpMax}</b> (${n.kpSource === 'forecast' ? 'NOAA 3-day forecast' : 'NOAA 27-day outlook, lower confidence'})` : ' · no Kp data for this night'}.</p>
        ${kpRows.length ? `<table class="plain"><tr><th>From</th><th>Kp</th><th>Type</th></tr>${kpRows.join('')}</table>` : ''}
        ${isFirst && aw?.data ? `<p class="small">AuroraWatch UK alert level now: <b>${esc(aw.data.status)}</b>${aw.data.updated ? ` (updated ${fmtWhen(Date.parse(aw.data.updated))})` : ''}.</p>` : ''}
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

function renderHow() {
  const s = CFG.stargazing, a = CFG.aurora;
  $('how').innerHTML = `<summary>How the score works</summary>
    <p>Each night runs from sunset to sunrise and is split into hours. Every hour gets a <b>quality</b> from 0 to 1 by multiplying four factors:</p>
    <ul>
      <li><b>Darkness</b>: 0 in civil twilight, ${CFG.darkness.nauticalWeight} at the end of nautical twilight (Sun ${CFG.darkness.nautical}°), 1 in full astronomical darkness (Sun below ${CFG.darkness.astro}°).</li>
      <li><b>Clear sky</b>: 1 − ${s.cloudWeight} × cloud fraction (from the Open-Meteo forecast).</li>
      <li><b>Moon</b>: 1 − ${s.moonWeight} × illumination × height effect. A Moon just above the horizon counts ${Math.round(CFG.moon.lowMoonShare * 100)}%, rising to full effect at ${CFG.moon.fullEffectAltitude}°. A Moon below the horizon has no effect.</li>
      <li><b>Visibility</b>: 1 − ${s.visibilityWeight} × haze, where visibility below ${CFG.visibility.poorMetres / 1000} km is thick haze and above ${CFG.visibility.goodMetres / 1000} km is clear.</li>
    </ul>
    <p><b>Stargazing score</b>: each hour's quality is raised to the power ${s.emphasis} (so a 0.5 hour counts as ${Math.pow(0.5, s.emphasis)}), the results are added up, and the total is expressed as a share of ${s.targetHours} perfect hours, capped at 100. Four clear, dark, moonless hours earn a full score, and many mediocre hours cannot add up to a good night.</p>
    <p><b>Aurora score</b> = the best single hour's chance: a base chance from the Kp index (Kp 4 → ${Math.round(C.kpChance(4) * 100)}%, Kp 5 → ${Math.round(C.kpChance(5) * 100)}%, Kp 6 → ${Math.round(C.kpChance(6) * 100)}%, Kp 7 → ${Math.round(C.kpChance(7) * 100)}%), reduced by cloud (weight ${a.cloudWeight}), a bright Moon (weight ${a.moonWeight}) and twilight. Nights beyond NOAA's 3-day forecast use the 27-day outlook at ${Math.round(a.outlookWeight * 100)}% trust.</p>
    <p><b>Observing score</b> = the higher of the two. The <b>best window</b> is the run of consecutive hours rated ${Math.round(s.windowThreshold * 100)} or more with the greatest total.</p>
    <p>All weights live in the <code>CONFIG</code> object at the top of the core script in <code>index.html</code>.</p>`;
}

function renderFooter() {
  const d = state.data;
  const rows = d?.sources ? Object.values(d.sources).map((s) => `<div class="${s.ok ? 'src-ok' : 'src-bad'}">${s.ok ? '●' : '○'} <a href="${esc(s.url)}" rel="noopener">${esc(s.label)}</a>, ${s.lastSuccessAt ? 'last updated ' + fmtWhen(Date.parse(s.lastSuccessAt)) : 'never fetched'}${s.ok ? '' : ' (latest fetch failed: ' + esc(s.error || 'unknown') + ')'}</div>`).join('') : '';
  $('footer').innerHTML = `<p><b>Data sources</b></p>${rows}<p>Sun, Moon and twilight are calculated in this page with SunCalc. ISS passes use satellite.js (SGP4) with CelesTrak orbital elements. Times are UK local time.</p>`;
}

function render() {
  renderStatus();
  const m = location.hash.match(/^#night-(\d{4}-\d{2}-\d{2})$/);
  if (m && state.forecast) renderDetail(m[1]); else renderOverview();
  renderHow();
  renderFooter();
}

window.addEventListener('hashchange', () => { if (state.forecast) render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.data && Date.now() - Date.parse(state.data.generatedAt || 0) > 3600e3) load();
});
setInterval(() => { compute(); render(); }, 10 * 60e3); // keep "tonight" and "past" hours current
load();
})();
</script>
</body>
</html>
